[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evomd"
version = "0.1.0"
description = "A molecular-simulation-driven evolutionary engine for peptide sequence optimization."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "VachaLab" }
]
dependencies = [
    "numpy",
    "pyyaml",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/VachaLab/modular_evomd"

# Console commands installed alongside the library. Each points to a
# module-level main() function; the command name is independent of the
# underlying module's filename.
[project.scripts]
evo-md = "evomd.cli.evo_md:main"
peptide-viewer = "evomd.viz.peptide_viewer:main"
sequence-logo = "evomd.viz.sequence_logo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
