optimize: minimize
populate_method: mixture
mixture_options: [
  faces,
  mutations,
  swap,
]
mixture_weights: [
  4,    
  4,       
  2,
]
populate_weighted: False
extra_mutation: True
also_mutate_probability: 0.4

include_discarded: False

first_fill: mixture
check_validity: False
face_reference: negative
face_slice_angle: 120
maximum_swap_ratio: 0.5
minimum_swap_ratio: 0.1
swap_reconstruct: parent
swap_random_probability: 0.05
# ------------------
positive_preference: False
positive_position: 0.
positive_tolerance: 0.5
negative_preference: False
negative_position: -1.
negative_tolerance: 0.5
# ------------------
prohibited_patterns: 
  [
  KKKK,
  LLLL,
  IIII,
  AAAA,
  RRRR,
  EEEE,
  GG,
  ]
peptide_len: 22
sequences: 
  [
  ]

# --- restrictions ---
hydrophobic_restriction: True
hydrophobic_min: 5.5
hdistribution_restriction: False
hindex_restriction: False
charge_restriction: False
iterations_elite: 1
population: 16
discard_ratio: 0.5
mut_aa: ADEFGHIKLMNQRSTVWY  #  C and P were removed
constructor: constructor # constructor method
calculator: calculations # calculator method
analyzer: analyzer_umbrella # analyzer method
sleep_time: 1800  # 30 min
max_check_cycle: 200 # 200 hours = 8.3 days
